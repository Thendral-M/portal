
name: Claude Code Review on Push

on:
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate Commit Diff
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git show --format= --root "$HEAD_SHA" > changes.diff
          else
            git diff "$BASE_SHA" "$HEAD_SHA" > changes.diff
          fi

      - name: Run Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p \
            "$(cat prompts/code_review_prompt.md)

            Review the changes in changes.diff.
            Read the affected source files for context.
            Do not modify any source files.
            Generate a detailed Markdown review report." \
            --allowedTools "Read,Glob,Grep" \
            > code_review_report.md

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Review-Report
          path: code_review_report.md
          if-no-files-found: error
