name: Codex Code Review on Push

on:
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure Codex for Azure OpenAI
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-5.1-codex' }}
        run: |
          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "::error::Repository variable AZURE_OPENAI_ENDPOINT is not set (e.g. https://my-resource.openai.azure.com)"
            exit 1
          fi
          # Accept either the bare resource URL or the full URL Foundry shows
          # (e.g. https://x.services.ai.azure.com/openai/v1/responses).
          AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT%/}"
          AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT%/responses}"
          AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT%/v1}"
          AZURE_OPENAI_ENDPOINT="${AZURE_OPENAI_ENDPOINT%/openai}"
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml <<EOF
          model = "${AZURE_OPENAI_DEPLOYMENT}"
          model_provider = "azure"

          [model_providers.azure]
          name = "Azure OpenAI"
          base_url = "${AZURE_OPENAI_ENDPOINT}/openai/v1"
          env_key = "AZURE_OPENAI_API_KEY"
          wire_api = "responses"
          EOF
          cat ~/.codex/config.toml

      - name: Generate Commit Diff
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git show --format= --root "$HEAD_SHA" > changes.diff
          else
            git diff "$BASE_SHA" "$HEAD_SHA" > changes.diff
          fi

      - name: Build Review Prompt
        run: |
          {
            cat prompts/code_review_prompt.md
            echo
            echo "Review the changes in changes.diff."
            echo "Read the affected source files for context."
            echo "Do not modify any source files."
            echo "Return the review as JSON matching the output schema."
          } > review_prompt.md

      - name: Run Codex Code Review
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$AZURE_OPENAI_API_KEY" ]; then
            echo "::error::Repository secret AZURE_OPENAI_API_KEY is not set (Azure portal > your OpenAI resource > Keys and Endpoint > KEY 1)"
            exit 1
          fi
          codex exec \
            --sandbox read-only \
            --output-schema prompts/review_schema.json \
            --output-last-message review.json \
            - < review_prompt.md

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Excel Report
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REVIEW_MODEL: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'gpt-5.1-codex' }}
        run: |
          pip install --quiet openpyxl
          REPORT="Code_Review_${GITHUB_REF_NAME//\//-}_${HEAD_SHA:0:7}.xlsx"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          python .github/scripts/review_to_excel.py review.json "$REPORT"

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Code-Review-${{ github.sha }}
          path: |
            ${{ env.REPORT }}
            review.json
          if-no-files-found: error
