name: Codex Code Review on Push

on:
  push:
    branches:
      - main
      - develop
      - feature/**

permissions:
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Authenticate Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Generate Commit Diff
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git show --format= --root "$HEAD_SHA" > changes.diff
          else
            git diff "$BASE_SHA" "$HEAD_SHA" > changes.diff
          fi

      - name: Build Review Prompt
        run: |
          {
            cat prompts/code_review_prompt.md
            echo
            echo "Review the changes in changes.diff."
            echo "Read the affected source files for context."
            echo "Do not modify any source files."
            echo "Generate a detailed Markdown review report."
          } > review_prompt.md

      - name: Run Codex Code Review
        run: |
          codex exec \
            --model gpt-5.1-codex \
            --sandbox read-only \
            --output-last-message code_review_report.md \
            - < review_prompt.md

      - name: Upload Review Report
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Code-Review-Report
          path: code_review_report.md
          if-no-files-found: error
