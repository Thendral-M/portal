# AI code review on push (GitLab CI).
# All logic lives in ci/run_review.sh, which the GitHub workflow also uses.
#
# Settings > CI/CD > Variables (mark keys "Masked"; untick "Protected" unless
# every reviewed branch, including feature/*, is a protected branch):
#   REVIEW_PROVIDER            codex | claude  (empty = auto-detect from the keys)
#   codex : AZURE_OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_DEPLOYMENT (optional)
#   claude: ANTHROPIC_API_KEY, CLAUDE_MODEL (optional, default sonnet)
#   FAIL_ON_CHANGES_REQUESTED  true to fail the job on "Changes requested" (optional)
#   REVIEW_SCOPE               full (default: whole code base) | diff (only the files changed by the push);
#                              both use prompts/entire-application-review.md
#   REVIEW_WEB_RESEARCH        true lets Claude use WebSearch/WebFetch for CVE research (optional)
#   CLAUDE_MAX_BUDGET_USD      cost cap per review (default 25 for full, 5 for diff)

stages:
  - analysis
  - review

# SonarQube static analysis (settings come from sonar-project.properties /
# the SONAR_HOST_URL and SONAR_TOKEN CI/CD variables).
analysis:
  stage: analysis
  image:
    name: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner

ai-code-review:
  stage: review
  image: node:22-bookworm
  timeout: 90m
  variables:
    GIT_DEPTH: "0"            # full history, needed to find where a branch started
    GIT_STRATEGY: clone
    # ------------------------------------------------------------------
    # TEMPORARY - FOR PIPELINE TESTING ONLY. REMOVE BEFORE HANDOVER.
    # Testing with Azure OpenAI (Codex). Once the client adds their key under
    # Settings > CI/CD > Variables (Masked), delete these lines and regenerate
    # the Azure key (Azure portal > Keys and Endpoint > Regenerate).
    # A Settings variable overrides the value here.
    # ------------------------------------------------------------------
    REVIEW_PROVIDER: "codex"
    AZURE_OPENAI_API_KEY: ""
    AZURE_OPENAI_ENDPOINT: "https://claude-code-review.services.ai.azure.com/openai/v1/responses"
    AZURE_OPENAI_DEPLOYMENT: "gpt-5.1-codex-max"
    # Cheaper test runs (optional): review only the files changed by the push.
    # REVIEW_SCOPE: "diff"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\//)'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 python3-openpyxl git ca-certificates > /dev/null
  script:
    - bash ci/run_review.sh
  artifacts:
    when: always
    name: "ai-code-review-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - review-output/
    expire_in: 30 days
